<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Main TTO — Now Serving</title>
<style>
html,body{margin:0;height:100%;background:#000;color:white;font-family:Arial,Tahoma,sans-serif}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
h1{font-size:clamp(48px,8vw,100px);margin:0 0 20px}#number{font-size:clamp(100px,20vw,250px);font-weight:bold}
#counter{font-size:clamp(24px,4vw,42px);min-height:1.3em;margin-top:12px}
#gate{position:fixed;inset:0;background:#080808;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:2}
button{background:#2563eb;color:white;border:0;border-radius:12px;font-size:26px;padding:20px 35px;cursor:pointer}
#status{font-size:15px;color:#aaa;position:fixed;bottom:18px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
<div id="gate"><h2>منادي Main TTO</h2><button id="enable">تفعيل الصوت</button></div>
<h1>Now Serving</h1><div id="number">-</div><div id="counter"></div><div id="status">Connecting...</div>
<script>
const cfg={apiKey:"AIzaSyCWWnMsge75Q3_MDF9Aj9wo4C5KD6RVGfw",authDomain:"q-matic-b7d77.firebaseapp.com",databaseURL:"https://q-matic-b7d77-default-rtdb.firebaseio.com",projectId:"q-matic-b7d77",storageBucket:"q-matic-b7d77.appspot.com",messagingSenderId:"908187704899",appId:"1:908187704899:web:b8bcf33cda90bafe81bef6"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.database(),ROOT='main_TTO';
const numberEl=document.getElementById('number'),counterEl=document.getElementById('counter'),statusEl=document.getElementById('status');
let enabled=false,playing=false;const queue=[];
const ticketPlayer=new Audio(),counterPlayer=new Audio();
ticketPlayer.preload='auto';counterPlayer.preload='auto';
const COUNTER_EARLY_SECONDS=0.7; // Change to 0.5 or 0.9 to fine-tune overlap.
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function getCounter(v){
  const raw=v.windowNum??v.window??v.counter??v.win??null;
  if(raw===null||raw==='')return null;
  const match=String(raw).match(/\d+/);
  const n=match?Number(match[0]):NaN;
  return Number.isInteger(n)&&n>=1&&n<=4?n:null;
}
function playFile(player,path){
  return new Promise(resolve=>{
    let done=false;
    const finish=()=>{
      if(done)return;
      done=true;
      player.removeEventListener('ended',finish);
      player.removeEventListener('error',fail);
      resolve();
    };
    const fail=()=>{statusEl.textContent='ملف الصوت غير موجود أو تعذر تشغيله: '+path;finish();};
    player.addEventListener('ended',finish);
    player.addEventListener('error',fail);
    player.src=path;
    player.load();
    player.play().catch(e=>{statusEl.textContent='تعذر تشغيل الصوت: '+e.message;finish();});
  });
}
async function announce(n,w){
  const ticketPath=`audio/${n}.mp3`;
  if(!w){await playFile(ticketPlayer,ticketPath);return;}

  let counterStarted=false;
  let counterPromise=null;
  function startCounter(){
    if(counterStarted)return;
    counterStarted=true;
    statusEl.textContent='الرجاء التوجه إلى الشُبّاك رقم '+w;
    counterPromise=playFile(counterPlayer,`audio/counter${w}.mp3`);
  }
  function onProgress(){
    if(Number.isFinite(ticketPlayer.duration)&&ticketPlayer.duration>0 &&
       ticketPlayer.duration-ticketPlayer.currentTime<=COUNTER_EARLY_SECONDS){
      startCounter();
    }
  }
  ticketPlayer.addEventListener('timeupdate',onProgress);
  const ticketPromise=playFile(ticketPlayer,ticketPath);
  try{
    await ticketPromise;
    // If the duration was unavailable, or playback failed, don't lose the counter call.
    if(!counterStarted)startCounter();
    await counterPromise;
  }finally{
    ticketPlayer.removeEventListener('timeupdate',onProgress);
  }
}
async function pump(){
  if(playing||!enabled)return;
  playing=true;
  try{
    while(queue.length){
      const {number:n,counter:w}=queue.shift();
      numberEl.textContent=n;
      counterEl.textContent=w?'الشُبّاك رقم '+w:'';
      statusEl.textContent='تذكرة رقم '+n;
      await announce(n,w);
      await wait(600);
    }
  }finally{playing=false;}
}
document.getElementById('enable').onclick=async()=>{
  enabled=true;
  document.getElementById('gate').style.display='none';
  pump();
};
db.ref(`${ROOT}/latest`).on('value',s=>{
  const v=s.val()||{};const n=Number(v.number);
  if(n>0){numberEl.textContent=n;const w=getCounter(v);counterEl.textContent=w?'الشُبّاك رقم '+w:'';}
},e=>statusEl.textContent='Firebase error: '+e.message);
const started=Date.now()-5000;
const seen=new Map();
function receive(s){
  const v=s.val()||{},n=Number(v.number),ts=Number(v.ts)||0;
  if(!(n>=1&&n<=1000)||ts<started)return;
  const old=seen.get(s.key);if(old===ts)return;
  seen.set(s.key,ts);
  queue.push({number:n,counter:getCounter(v)});
  pump();
}
db.ref(`${ROOT}/calls`).orderByChild('ts').startAt(started).on('child_added',receive,e=>statusEl.textContent='Firebase error: '+e.message);
db.ref(`${ROOT}/calls`).on('child_changed',receive,e=>statusEl.textContent='Firebase error: '+e.message);
</script>
</body></html>
