<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Main TTO — Now Serving</title>
<style>
html,body{margin:0;height:100%;background:#000;color:white;font-family:Arial,Tahoma,sans-serif}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
h1{font-size:clamp(48px,8vw,100px);margin:0 0 20px}#number{font-size:clamp(100px,20vw,250px);font-weight:bold}
#gate{position:fixed;inset:0;background:#080808;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:2}
button{background:#2563eb;color:white;border:0;border-radius:12px;font-size:26px;padding:20px 35px;cursor:pointer}
#status{font-size:15px;color:#aaa;position:fixed;bottom:18px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
<div id="gate"><h2>منادي Main TTO</h2><button id="enable">تفعيل الصوت</button></div>
<h1>Now Serving</h1><div id="number">-</div><div id="status">Connecting...</div>
<script>
const cfg={apiKey:"AIzaSyCWWnMsge75Q3_MDF9Aj9wo4C5KD6RVGfw",authDomain:"q-matic-b7d77.firebaseapp.com",databaseURL:"https://q-matic-b7d77-default-rtdb.firebaseio.com",projectId:"q-matic-b7d77",storageBucket:"q-matic-b7d77.appspot.com",messagingSenderId:"908187704899",appId:"1:908187704899:web:b8bcf33cda90bafe81bef6"};
firebase.initializeApp(cfg);
const db=firebase.database(),ROOT='main_TTO';
const numberEl=document.getElementById('number'),statusEl=document.getElementById('status');
let enabled=false,playing=false;const queue=[];
const player=new Audio();player.preload='auto';
const playAudio=(n)=>new Promise(resolve=>{
  let done=false;const finish=()=>{if(done)return;done=true;player.onended=null;player.onerror=null;resolve();};
  player.onended=finish;player.onerror=()=>{statusEl.textContent='ملف الصوت غير موجود: '+n+'.mp3';finish();};
  player.src=`audio/${n}.mp3`;player.load();player.play().catch(e=>{statusEl.textContent='تعذر تشغيل الصوت: '+e.message;finish();});
});
async function pump(){if(playing||!enabled)return;playing=true;while(queue.length){const n=queue.shift();numberEl.textContent=n;statusEl.textContent='تذكرة رقم '+n;await playAudio(n);await new Promise(r=>setTimeout(r,600));}playing=false;}
document.getElementById('enable').onclick=()=>{enabled=true;document.getElementById('gate').style.display='none';pump();};
// Show the most recent ticket even after a page reload.
db.ref(`${ROOT}/latest`).on('value',s=>{const n=Number(s.val()?.number);if(n>0)numberEl.textContent=n;},e=>statusEl.textContent='Firebase error: '+e.message);
// Each call event triggers an announcement. child_changed covers repeat calls to the same ticket.
const started=Date.now()-5000;
const seen=new Map();
function receive(s){const v=s.val()||{},n=Number(v.number),ts=Number(v.ts)||0;if(!(n>=1&&n<=1000)||ts<started)return;const old=seen.get(s.key);if(old===ts)return;seen.set(s.key,ts);queue.push(n);pump();}
db.ref(`${ROOT}/calls`).orderByChild('ts').startAt(started).on('child_added',receive,e=>statusEl.textContent='Firebase error: '+e.message);
db.ref(`${ROOT}/calls`).on('child_changed',receive,e=>statusEl.textContent='Firebase error: '+e.message);
</script>
</body></html>
